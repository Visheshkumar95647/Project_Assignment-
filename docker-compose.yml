version: "3.9"

services:
  db:
    image: postgres:16
    container_name: food_ordering_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: food_ordering_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: food_ordering_backend
    restart: always
    env_file:
      - ./server/.env
    environment:
      DATABASE_URL: postgresql://postgres:root@db:5432/food_ordering_db
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: food_ordering_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data: